---
- name: Destroy container workload resource group and all nested resources
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - azure.azcollection
  vars_files:
    - vars/container_workload_defaults.yml
  tasks:
    - name: Delete resource group (includes ACR, SQL, Storage, Container Apps, Front Door, and deployments)
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ container_workload_resource_group_name }}"
        location: "{{ container_workload_region }}"
        state: absent
        force_delete_nonempty: true
