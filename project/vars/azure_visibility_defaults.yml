---
# Defaults for playbooks 10 (Azure storage visibility HTML report) and 11 (ntfy URL).

# Resource group scanned for storage accounts (often same as container workload RG).
azure_visibility_resource_group_name: "aca-ansible-demo-rg"

# Local path on the execution environment (HTML table of storage accounts).
azure_visibility_report_local_path: "/tmp/azure_cloud_report.html"

# When true, set_stats report_url is the Front Door URL (vars from container_workload_defaults.yml).
# When false, pass -e report_url=... before playbook 10 completes the set_fact step, or chain only 11 with -e report_url.
azure_visibility_use_front_door_url: true

# Default ntfy topic for playbook 11 (override with -e ntfy_topic=...).
azure_visibility_ntfy_topic: "rh-azure-cloud-report"
