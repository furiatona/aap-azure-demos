---
# Azure visibility (phase 1): HTML report of storage accounts in one resource group.
# Mirrors the spirit of awsinfravis25 playbooks/cloud_report.yml (gather -> template -> publish).
#
# Publish: uploads HTML to a private blob container, then builds a time-limited read SAS URL
# (works when the storage account disallows public blob access).
# Blob upload uses auth_mode key (account key) by default; SAS helper needs the same key from ARM.
# If shared key access is disabled on the account, set azure_visibility_blob_auth_mode: login,
# grant Storage Blob Data Contributor, and extend this playbook (user-delegation SAS) later.
#
# Extra vars: override any key from vars/azure_visibility_defaults.yml
#
- name: Azure storage visibility report
  hosts: localhost
  connection: local
  gather_facts: true
  collections:
    - azure.azcollection
  vars_files:
    - vars/azure_visibility_defaults.yml
  tasks:
    - name: List storage accounts in resource group
      azure.azcollection.azure_rm_storageaccount_info:
        resource_group: "{{ azure_visibility_resource_group_name }}"
        auth_mode: login
      register: visibility_storage_facts

    - name: Normalize storage account list for templating
      ansible.builtin.set_fact:
        azure_visibility_storage_accounts: >-
          {{
            visibility_storage_facts.azure_storageaccounts
            | default(visibility_storage_facts.storageaccounts | default([]))
          }}

    - name: Render HTML report locally
      ansible.builtin.template:
        src: azure_visibility/cloud_report.html.j2
        dest: "{{ azure_visibility_report_local_path }}"
        mode: "0644"

    - name: Fetch report storage account keys for SAS (management plane)
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      azure.azcollection.azure_rm_storageaccount_info:
        resource_group: "{{ azure_visibility_resource_group_name }}"
        name: "{{ azure_visibility_report_storage_account_name }}"
        show_connection_string: true
        auth_mode: login
      register: _visibility_report_sa_info
      no_log: true

    - name: Resolve blob endpoint key material for SAS helper
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      ansible.builtin.set_fact:
        _visibility_report_sa0: "{{ (_visibility_report_sa_info.storageaccounts | default(_visibility_report_sa_info.azure_storageaccounts))[0] }}"
      no_log: true

    - name: Normalize primary blob endpoint metadata
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      ansible.builtin.set_fact:
        _visibility_blob_meta: "{{ (_visibility_report_sa0.primary_endpoints | default({}, true)).blob | default({}, true) }}"
      no_log: true
      no_log: true

    - name: Extract account key for SAS generation
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      ansible.builtin.set_fact:
        report_blob_account_key: >-
          {{
            (
              _visibility_blob_meta.key
              | default(
                  (
                    (
                      _visibility_blob_meta.connectionstring
                      | default(_visibility_blob_meta.connectionString | default('', true), true)
                    ).split('AccountKey=')[1]
                  ).split(';')[0]
                  if (
                    'AccountKey='
                    in (
                      _visibility_blob_meta.connectionstring
                      | default(_visibility_blob_meta.connectionString | default('', true), true)
                    )
                  )
                  else ''
                ),
                true,
              )
            )
          }}
      no_log: true

    - name: Fail when storage account key cannot be read (SAS path requires listKeys / connection string)
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
        - (report_blob_account_key | default('') | length) == 0
      ansible.builtin.fail:
        msg: >-
          Could not read storage account key for {{ azure_visibility_report_storage_account_name }}.
          Ensure the credential can list keys and the account allows shared key access, or set
          azure_visibility_publish_report to false and distribute the HTML path manually.

    - name: Upload report to blob storage (private container)
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      azure.azcollection.azure_rm_storageblob:
        resource_group: "{{ azure_visibility_resource_group_name }}"
        storage_account_name: "{{ azure_visibility_report_storage_account_name }}"
        container: "{{ azure_visibility_report_container_name }}"
        blob: "{{ azure_visibility_report_blob_name }}"
        src: "{{ azure_visibility_report_local_path }}"
        content_type: "text/html; charset=utf-8"
        force: true
        auth_mode: "{{ azure_visibility_blob_auth_mode }}"

    - name: Build HTTPS read URL with SAS for private blob
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/generate_blob_read_sas.py"
      environment:
        AZ_REPORT_ACCOUNT_NAME: "{{ azure_visibility_report_storage_account_name }}"
        AZ_REPORT_ACCOUNT_KEY: "{{ report_blob_account_key }}"
        AZ_REPORT_CONTAINER: "{{ azure_visibility_report_container_name }}"
        AZ_REPORT_BLOB: "{{ azure_visibility_report_blob_name }}"
        AZ_REPORT_SAS_HOURS: "{{ azure_visibility_sas_validity_hours | string }}"
      register: _visibility_sas_url_cmd
      changed_when: false

    - name: Set report URL fact (SAS)
      when:
        - azure_visibility_publish_report | bool
        - not ansible_check_mode
      ansible.builtin.set_fact:
        azure_visibility_report_url: "{{ _visibility_sas_url_cmd.stdout | trim }}"

    - name: Clear report URL when not publishing
      when: not (azure_visibility_publish_report | bool) or ansible_check_mode
      ansible.builtin.set_fact:
        azure_visibility_report_url: ""

    - name: Show report URL
      ansible.builtin.debug:
        msg: >-
          Report URL (read SAS, expires per azure_visibility_sas_validity_hours): {{ azure_visibility_report_url if (azure_visibility_report_url | default('') | length > 0) else '(not published - see azure_visibility_publish_report / check mode)' }}

    - name: Publish report URL for follow-on workflow jobs (AAP set_stats)
      ansible.builtin.set_stats:
        data:
          report_url: "{{ azure_visibility_report_url | default('') }}"
          report_local_path: "{{ azure_visibility_report_local_path }}"
        per_host: false
