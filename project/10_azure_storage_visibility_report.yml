---
# Azure visibility (phase 1): HTML report of storage accounts in one resource group.
# Mirrors the spirit of awsinfravis25 playbooks/cloud_report.yml (gather -> template -> publish).
#
# The HTML is written on the execution node (report_local_path). For workflows / ntfy (11),
# report_url is the Front Door HTTPS URL from the same defaults as playbook 04 (demo entry),
# not a blob SAS link — avoids storage public-access and account-key/SAS complexity.
#
# Requires playbook 04 (or equivalent) deployed when azure_visibility_use_front_door_url is true.
#
# Extra vars: see vars/azure_visibility_defaults.yml and vars/container_workload_defaults.yml (FD names).
#
- name: Azure storage visibility report
  hosts: localhost
  connection: local
  gather_facts: true
  collections:
    - azure.azcollection
  vars_files:
    - vars/container_workload_defaults.yml
    - vars/azure_visibility_defaults.yml
  tasks:
    - name: List storage accounts in resource group
      azure.azcollection.azure_rm_storageaccount_info:
        resource_group: "{{ azure_visibility_resource_group_name }}"
        auth_mode: login
      register: visibility_storage_facts

    - name: Normalize storage account list for templating
      ansible.builtin.set_fact:
        azure_visibility_storage_accounts: >-
          {{
            visibility_storage_facts.azure_storageaccounts
            | default(visibility_storage_facts.storageaccounts | default([]))
          }}

    - name: Render HTML report locally
      ansible.builtin.template:
        src: azure_visibility/cloud_report.html.j2
        dest: "{{ azure_visibility_report_local_path }}"
        mode: "0644"

    - name: Resolve Front Door URL for notification (same endpoint as container demo)
      when: azure_visibility_use_front_door_url | default(true) | bool
      block:
        - name: Load Front Door hostname from Azure
          ansible.builtin.include_tasks: tasks/front_door_set_url_facts.yml
      rescue:
        - name: Front Door lookup failed (deploy 04 or disable FD URL mode)
          ansible.builtin.set_fact:
            front_door_url: ""

    - name: Choose report_url for set_stats (-e report_url wins; else Front Door when enabled)
      ansible.builtin.set_fact:
        azure_visibility_report_url: >-
          {{
            (report_url | default(''))
            if (report_url | default('') | length > 0)
            else (
              (front_door_url | default(''))
              if (azure_visibility_use_front_door_url | default(true) | bool)
              else (report_url | default('', true))
            )
          }}

    - name: Fail when no URL for downstream ntfy (Front Door missing and no -e report_url=)
      when:
        - (azure_visibility_report_url | default('') | length) == 0
      ansible.builtin.fail:
        msg: >-
          No report_url available. Run playbook 04 first so Front Door exists, or pass
          -e report_url=https://... , or set azure_visibility_use_front_door_url: false with -e report_url=...

    - name: Show paths and demo URL
      ansible.builtin.debug:
        msg:
          - "HTML report (on controller): {{ azure_visibility_report_local_path }}"
          - "Demo / notification URL (Front Door): {{ azure_visibility_report_url }}"

    - name: Publish for follow-on workflow jobs (AAP set_stats)
      ansible.builtin.set_stats:
        data:
          report_url: "{{ azure_visibility_report_url }}"
          report_local_path: "{{ azure_visibility_report_local_path }}"
        per_host: false
